name: Validar Droid Zap 0.7 experimental

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Extrair código 0.7.0-dev
        run: |
          mkdir project
          unzip -o DroidZap-source-0.7.0-dev3.zip -d project

      - name: Configurar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Configurar Go 1.25
        uses: actions/setup-go@v6
        with:
          go-version: "1.25.x"
          cache-dependency-path: project/protocol/go/go.sum

      - name: Gerar biblioteca Android do protocolo
        working-directory: project/protocol/go
        run: |
          go mod download
          go install golang.org/x/mobile/cmd/gomobile@latest
          gomobile init
          mkdir -p ../../app/libs
          gomobile bind -target=android -androidapi=30 -o ../../app/libs/droidzapbridge.aar ./bridge

      - name: Configurar Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Compilar e verificar
        run: gradle -p project --no-daemon lint assembleDebug

      - name: Renomear APK experimental
        run: cp project/app/build/outputs/apk/debug/app-debug.apk DroidZap-0.7.0-dev.apk

      - name: Disponibilizar APK de teste
        uses: actions/upload-artifact@v4
        with:
          name: DroidZap-0.7.0-dev
          path: DroidZap-0.7.0-dev.apk
