name: Validar Droid Zap 0.8 RC3 assinada

on:
  push:
    branches: [main, codex/droidzap-0.8.0-rc3]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Extrair código 0.8.0-rc3
        run: |
          mkdir project
          unzip -o DroidZap-source-0.8.0-rc3.zip -d project

      - name: Configurar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Configurar Go 1.25
        uses: actions/setup-go@v6
        with:
          go-version: "1.25.x"
          cache-dependency-path: project/protocol/go/go.sum

      - name: Gerar biblioteca Android do protocolo
        working-directory: project/protocol/go
        run: |
          go mod download
          go install golang.org/x/mobile/cmd/gomobile@latest
          gomobile init
          mkdir -p ../../app/libs
          gomobile bind -target=android -androidapi=30 -o ../../app/libs/droidzapbridge.aar ./bridge

      - name: Restaurar chave privada de assinatura
        run: echo "${{ secrets.DROIDZAP_KEYSTORE_BASE64 }}" | base64 --decode > project/app/droidzap-release.jks

      - name: Configurar Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Compilar, verificar e assinar
        env:
          DROIDZAP_KEYSTORE_PATH: droidzap-release.jks
          DROIDZAP_KEYSTORE_PASSWORD: ${{ secrets.DROIDZAP_KEYSTORE_PASSWORD }}
          DROIDZAP_KEY_ALIAS: ${{ secrets.DROIDZAP_KEY_ALIAS }}
          DROIDZAP_KEY_PASSWORD: ${{ secrets.DROIDZAP_KEY_PASSWORD }}
        run: gradle -p project --no-daemon lintRelease assembleRelease

      - name: Validar certificado da APK
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)
          "$APKSIGNER" verify --verbose --print-certs project/app/build/outputs/apk/release/app-release.apk | tee signing.txt
          grep -qi "7c1179ff83e55f98d6fe116b206c9a7ebd03782c8b1aff0909a5b0819d38e3af" signing.txt

      - name: Renomear APK assinada
        run: cp project/app/build/outputs/apk/release/app-release.apk DroidZap-0.8.0-rc3-signed.apk

      - name: Disponibilizar APK 0.8 RC3 assinada
        uses: actions/upload-artifact@v4
        with:
          name: DroidZap-0.8.0-rc3-signed
          path: DroidZap-0.8.0-rc3-signed.apk
