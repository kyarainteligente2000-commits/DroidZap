name: Gerar APK do Droid Zap

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4
      - name: Extrair projeto
        run: unzip -q DroidZap-source-0.6.2.zip -d project
      - name: Configurar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Configurar Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Validar e compilar
        run: gradle -p project --no-daemon lint assembleDebug
      - name: Preparar APK
        run: cp project/app/build/outputs/apk/debug/app-debug.apk DroidZap-0.6.2-debug.apk
      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: DroidZap-0.6.2-debug
          path: DroidZap-0.6.2-debug.apk
